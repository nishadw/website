<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Norman</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4F6FA;--surface:#fff;--ink:#0B1220;--mut:#5B6577;--line:#E3E7EE;--soft:#F0F3F8;--acc:#3248F5;--acc-soft:#E9ECFF;--up:#087F5B;--up-soft:#E3F5EE;--down:#C92A2A;--down-soft:#FCEBEA;--warn:#B45309;--shadow:0 12px 40px rgba(11,18,32,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#0C0F14;--surface:#131821;--ink:#E8ECF3;--mut:#94A0B4;--line:#232B38;--soft:#1A212C;--acc:#8C9BFF;--acc-soft:#1C2347;--up:#4FD1A1;--up-soft:#12302A;--down:#FF8A80;--down-soft:#3A1C1B;--warn:#F2B15A;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.page{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
.mut{color:var(--mut)}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.num{text-align:right;white-space:nowrap}
/* gate */
.gate{max-width:340px;margin:18vh auto 0;display:flex;flex-direction:column;gap:14px}
.gate h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0}
.gate .rowf{display:flex;gap:8px}.gate input{flex:1;min-width:0}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:9px 16px;font-weight:500}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:18px}
.brand{font-size:20px;font-weight:600;letter-spacing:-.02em}
.search{flex:1 1 220px;max-width:340px}.search input{width:100%}
.readouts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.readout{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:left;display:flex;flex-direction:column;line-height:1.25;min-width:104px}
.readout b{font-size:16px;font-weight:600}.readout span{font-size:12px;color:var(--mut)}
/* list buttons */
.lists{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:thin}
.list{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.list i{font-style:normal;font-weight:400;font-size:12px;color:var(--mut)}
.list[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}.list[aria-selected=true] i{color:rgba(255,255,255,.75)}
@media (prefers-color-scheme:dark){.list[aria-selected=true]{color:#0C0F14}.list[aria-selected=true] i{color:rgba(12,15,20,.7)}}
/* view */
.viewhead{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;margin:8px 0 12px}
.def{margin:0;max-width:74ch;color:var(--mut);font-size:14px}.def b{color:var(--ink);font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice{background:var(--acc-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;max-width:74ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-weight:500;font-size:12px;color:var(--mut);text-align:left;padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0}
th.sort{cursor:pointer}th[data-tip] span{border-bottom:1px dotted var(--mut)}th[aria-sort] span::after{content:" ↓"}th[aria-sort=ascending] span::after{content:" ↑"}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
.tk{font-weight:600}.co{color:var(--mut);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:middle}
.more{margin:12px auto 0;display:block}.empty{padding:28px 14px;color:var(--mut)}
/* marks */
.traits{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}.traits i{width:11px;height:11px;border-radius:3px;background:var(--line)}.traits i.on{background:var(--acc)}
.bar{display:inline-flex;gap:2px;vertical-align:middle;margin-left:8px}.bar i{width:6px;height:12px;border-radius:2px;background:var(--line)}.bar i.u{background:var(--up)}.bar i.d{background:var(--down)}
.chip{display:inline-block;font-size:12px;line-height:1;padding:4px 7px;border-radius:6px;background:var(--soft);color:var(--mut);white-space:nowrap;margin:1px 4px 1px 0}
.chip.new{background:var(--acc-soft);color:var(--acc)}.chip.added,.chip.good{background:var(--up-soft);color:var(--up)}.chip.cut,.chip.sold,.chip.bad{background:var(--down-soft);color:var(--down)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:none;border-radius:8px;padding:5px 10px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* drawer */
.veil{position:fixed;inset:0;background:rgba(11,18,32,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease-out}
.drawer.open{transform:none}.drawer td,.drawer th{padding:8px 10px}.drawer .co{max-width:150px}@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.dhead .sp{flex:1}
.dbody{overflow-y:auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
.dbody h2{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15}.dbody h3{font-size:13px;font-weight:500;color:var(--mut);margin:0 0 8px}
.dbody p{margin:0;max-width:62ch}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--mut)}.kv [data-tip]{border-bottom:1px dotted var(--mut);cursor:help}
.checks{list-style:none;margin:0;padding:0}.checks li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.checks li i{flex:none;width:11px;height:11px;border-radius:3px;background:var(--line);margin-top:4px}.checks li.on i{background:var(--acc)}.checks li:not(.on){color:var(--mut)}
.defs{margin:0}.defs dt{font-weight:500;margin-top:12px}.defs dd{margin:2px 0 0;color:var(--mut);max-width:62ch}
a{color:var(--acc)}.linkish{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;text-underline-offset:2px}
footer{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);font-size:13px;align-items:center}
.plan{display:grid;gap:14px}.plan .pad{padding:16px 18px}.plan h3{font-size:13px;font-weight:500;color:var(--mut);margin:0 0 10px}.plan p{margin:10px 0 0;max-width:74ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.todo{list-style:none;margin:0;padding:0}.todo li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.todo li:last-child{border-bottom:0;padding-bottom:0}.todo li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--acc);margin-top:7px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:4px 0 10px}.split i{display:block}.legend{display:flex;flex-wrap:wrap;gap:6px 18px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
.star{background:none;border:0;padding:2px 8px 2px 0;color:var(--mut);font-size:15px;line-height:1;vertical-align:baseline}.star[aria-pressed=true]{color:var(--warn)}
@media (min-width:900px){.lists{flex-wrap:wrap;overflow:visible}}
/* tooltip */
#tip{position:fixed;z-index:40;max-width:300px;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:none;box-shadow:var(--shadow)}
@media (max-width:640px){.readouts{margin-left:0;width:100%}.readout{flex:1}.kv{grid-template-columns:1fr}.hide-s{display:none}td,th{padding:9px 10px}}
</style></head><body>
<div class="page">
<form id="gate" class="gate"><h1>Norman</h1><div class="rowf"><input id="pw" class="field" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Password" placeholder="Password" autofocus><button class="btn" type="submit">Open</button></div><span id="msg" class="mut" role="status"></span></form>
<div id="app" hidden>
<header class="top"><div class="brand">Norman</div><label class="search"><input id="q" class="field" type="search" placeholder="Find a ticker or company" aria-label="Find a ticker or company"></label><div class="readouts" id="readouts"></div></header>
<nav class="lists" id="lists" role="tablist" aria-label="Lists"></nav>
<section>
<div class="viewhead"><p class="def" id="def"></p><div class="tools" id="tools"></div></div>
<div class="notice" id="notice" hidden></div>
<div class="card" id="tcard"><div class="scroll" id="box"></div></div>
<div class="plan" id="plan" hidden></div>
<button class="ghost more" id="more" hidden>Show more</button>
</section>
<footer><button class="linkish" id="f-defs">Definitions</button><button class="linkish" id="f-tests">What was tested</button><span id="built"></span></footer>
</div>
</div>
<div class="veil" id="veil" hidden></div>
<aside class="drawer" id="drawer" aria-label="Detail" hidden><div class="dhead"><button class="ghost" id="d-back" hidden>Back</button><span class="sp"></span><button class="ghost" id="d-close">Close</button></div><div class="dbody" id="d-body"></div></aside>
<div id="tip" role="tooltip" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const sp = (v, d = 0) => v == null ? '–' : (v > 0 ? '+' : '') + v.toFixed(d) + '%', pc = (v, d = 0) => v == null ? '–' : v.toFixed(d) + '%';
const nm = (v, d = 1, u = '') => v == null ? '–' : v.toFixed(d) + u;
const tipped = (node, tip, focus) => { if (tip) { node.dataset.tip = tip; if (focus) node.tabIndex = 0; } return node; };

async function unlock(pw) {
  const dir = location.pathname.endsWith('.html') ? location.pathname.replace(/[^/]*$/, '') : location.pathname.replace(/\/?$/, '/');
  const res = await fetch(dir + 'data.enc.json', {cache: 'no-store'});
  if (!res.ok) throw new Error('nodata');
  const e = await res.json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(e.iv)}, key, b64(e.ct))));
}
$('#gate').addEventListener('submit', async (ev) => {
  ev.preventDefault(); $('#msg').textContent = 'Opening…';
  try { const d = await unlock($('#pw').value); try { sessionStorage.setItem('n', $('#pw').value); } catch (_) {} $('#gate').hidden = true; $('#app').hidden = false; start(d); }
  catch (err) { $('#msg').textContent = (err && err.message === 'nodata') ? 'The data file did not load. Reload the page.' : 'That password did not open it.'; }
});
try { const s = sessionStorage.getItem('n'); if (s) { $('#pw').value = s; $('#gate').requestSubmit(); } } catch (_) {}

/* tooltips: hover, keyboard focus, or tap */
(() => { const tip = $('#tip'); let cur = null;
  const show = (t) => { cur = t; tip.textContent = t.dataset.tip; tip.hidden = false; const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px'; tip.style.top = (r.bottom + 8 + h > innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + 'px'; };
  const hide = () => { cur = null; tip.hidden = true; };
  document.addEventListener('mouseover', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) show(t); else if (cur) hide(); });
  document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) show(t); });
  document.addEventListener('focusout', hide); document.addEventListener('scroll', hide, true);
  document.addEventListener('click', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && matchMedia('(hover:none)').matches) show(t); else if (!t) hide(); });
})();

function start(d) {
  const U = d.universe, F = d.funds.list, NF = F.length, byT = Object.fromEntries(U.map((r) => [r.t, r])), through = d.prices_through, asof = d.funds.asof;
  const MOVE = {new: 'New', added: 'Added', held: 'Held', cut: 'Cut', sold: 'Sold'};
  const TRAITS = [['R&D above 10% of sales', 'Spends heavily on research.'], ['Gross margin above 50%', 'Keeps more than half of each sales dollar after direct costs.'], ['Sales up more than 20%', 'Last four quarters against the four before.'],
    ['More cash than debt', 'Cash is larger than all borrowings.'], ['Cash flow positive', 'Operations brought in cash over the last four quarters.'], ['Sales above $1 billion', 'Already a real business, not a story.']];
  const D = {
    rank: 'Where the company ranks by the dollar value institutions hold in it. 1 is the largest; the page covers about the 1,000 largest.',
    g: 'Sales in the last four quarters against the four before.',
    gm: 'Share of sales left after the direct cost of what was sold.', rd: 'Research spending as a share of sales.',
    cf: 'Cash from operations over a year as a share of total assets.', nc: 'Cash minus all borrowings, in billions of dollars. Above zero means more cash than debt.',
    sl: 'Sales over the last four quarters, in billions of dollars.', sh: 'Change in the number of shares over a year. Up means existing owners were diluted.',
    cd: "Equipment spending divided by depreciation. Far above 1 means the company is building much faster than it writes off: Burry's argument about AI spending.",
    sb: 'Pay handed out in shares, as a share of sales.',
    p6: 'Price change over six months, month-end closes through ' + through + '.', p: 'Price change over twelve months, month-end closes through ' + through + '.',
    oh: 'How far the price sits below its highest month-end close of the past year.',
    rules: 'Three rules: sales up more than 10%, cash flow above 10% of assets, share count not up more than 3%. A reading list; the test found no reliable edge.',
    traits: 'Six traits that small companies which became giants tended to share. Each square is one trait; hover a square to see which.',
    odds: 'Of past companies in the same size band with this many traits, the share that entered the 150 largest within five years (2009–2022 starts). Starting size drives most of it, so read it as rough.',
    nf: 'How many of the ' + NF + ' tracked funds owned it on ' + asof + '. The bar shows their last move: green bought, grey held, red cut or sold.',
    top: 'Funds for which this is one of their ten largest positions.', avgw: 'Average share of the fund’s stock book, across the funds that own it.',
    long: 'Funds that have owned it for at least the last four quarters in a row.',
    add: 'Funds that already owned it and raised their share count by more than 5% last quarter. Stock splits are adjusted for.',
    flat: 'Funds whose share count moved less than 5% last quarter.', cut: 'Funds that cut their share count by more than 5% or sold out last quarter.',
    twice: 'Funds that raised their share count in each of the last two quarters.',
    move: 'New: not owned the quarter before. Added: share count up more than 5%. Held: within 5%. Cut: down more than 5%. Sold: owned the quarter before, gone now.',
    tech: 'Buy: price above its 10-month average and above its level six months ago. Strong buy: also up over twelve months and within 10% of its high. Month-end closes through ' + through + '. The desk’s own gauge, not a broker’s.',
    an: 'Average analyst rating on a scale of 1 (strong buy) to 5 (strong sell): up to 1.5 is Strong buy, up to 2.5 is Buy.',
    also: 'Other lists on this page that the stock is on.', held: 'You hold this.',
    circ: 'Circular financing: a supplier, customer or lender is also an investor or backstop. A desk draft list that you edit; it leaves out names this desk cannot show.',
    burry: 'Michael Burry’s fund reported put options against it in its last filing (September 2025). The fund has since deregistered, so there is no newer filing.',
    fsize: 'Value of the US-listed shares in the fund’s latest quarterly filing, in billions of dollars.', fn: 'Number of positions in the filing.',
    ftop: 'Share of the book in its ten largest positions.', fbig: 'Largest position this page can show.', qh: 'Quarters in a row the fund has owned it, up to five.',
    w: 'Share of the fund’s reported stock book.', dsh: 'Change in the fund’s share count against the quarter before.',
    shock: 'Three warnings that came before weak stock returns in both 1993–2009 and 2010–2026: inflation above 3% and rising, producer prices accelerating, oil up more than 50% in a year. A reading, not a rule.',
    book: 'Your book’s return since the scorecard started, next to the S&P 500 over the same days.', picks: 'Share of the book in your own picks, against the cap.',
    lead: 'The fund with the best 12-month total return at month-end, out of the S&P 500 (SPY), the equal-weight S&P 500 (RSP) and the Nasdaq 100 (QQQ). You buy it through the cheaper share class: SPYM, RSP or QQQM.',
    thirds: 'The stock funds are split into three equal parts. Each part checks the leader only in its own four months, so the whole core never switches at once.',
    m12: 'Total return over the twelve months to the end of ' + d.core.asof + '. This column decides the leader.',
    prov: 'The same twelve-month race if the month ended at the ' + d.core.stamp + ' close. It can change before month-end.',
    after: 'Average return of each fund over the twelve months after a month with that many warnings on, ' + d.core.after_span + '.',
    star: 'Add to or remove from your shortlist. Saved in this browser only.',
    nlists: 'How many of the five stock lists it is on: PLTR-like, Druckenmiller, Core holdings, Doubling down, Analyst + technical.',
    f13: 'Funds file their US-listed share holdings 45 days after each quarter ends. No short positions, options left out, and it is already six weeks old when it arrives.',
  };
  /* derived fields */
  for (const r of U) { const h = r.own.filter((o) => o[2] !== 'sold');
    r.nf = h.length; r.top = h.reduce((a, o) => a + o[5], 0); r.avgw = h.length ? h.reduce((a, o) => a + o[1], 0) / h.length : null; r.long = h.filter((o) => o[3] >= 4).length;
    r.nNew = h.filter((o) => o[2] === 'new').length; r.nAdd = h.filter((o) => o[2] === 'added').length; r.nFlat = h.filter((o) => o[2] === 'held').length; r.nCut = r.own.filter((o) => o[2] === 'cut' || o[2] === 'sold').length;
    r.twice = h.reduce((a, o) => a + o[4], 0); const m = /Druck (\w+)/.exec(r.tags); r.dk = m ? m[1] : ''; r.held = /(^|; )Held/.test(r.tags); r.circ = r.tags.includes('Circular'); r.burry = r.tags.includes('Burry'); }
  const hasAn = d.analyst.n > 0;
  const mid = U.filter((r) => r.k > 300).sort((a, b) => b.gt - a.gt || (b.od || 0) - (a.od || 0) || (b.g == null ? -1e9 : b.g) - (a.g == null ? -1e9 : a.g)); mid.forEach((r, i) => r.rk = i + 1);
  const IN = {traits: (r) => r.k > 300 && r.gt >= 4, druck: (r) => !!r.dk, core: (r) => r.nf >= 3, adding: (r) => r.nAdd >= 1 && r.nAdd >= r.nCut,
    both: (r) => r.k <= 500 && r.te >= 1 && !r.circ && (!hasAn || (r.an && (r.an[0] === 'Strong buy' || r.an[0] === 'Buy')))};
  const SHORT = {traits: 'PLTR-like', druck: 'Druck', core: 'Core', adding: 'Doubling', both: 'Buy + buy'};
  for (const r of U) r.on = Object.keys(IN).filter((k) => IN[k](r));

  /* shortlist stars: kept in this browser only */
  const stars = new Set(); try { JSON.parse(localStorage.getItem('norman-stars') || '[]').forEach((t) => { if (byT[t]) stars.add(t); }); } catch (_) {}
  const flip = (t) => { stars.has(t) ? stars.delete(t) : stars.add(t); try { localStorage.setItem('norman-stars', JSON.stringify([...stars])); } catch (_) {} };
  const star = (r, after) => { const b = el('button', 'star', stars.has(r.t) ? '★' : '☆'); b.setAttribute('aria-pressed', stars.has(r.t)); b.setAttribute('aria-label', (stars.has(r.t) ? 'Remove ' : 'Add ') + r.t + (stars.has(r.t) ? ' from' : ' to') + ' your shortlist'); b.dataset.tip = D.star;
    b.onclick = (e) => { e.stopPropagation(); flip(r.t); after(); }; return b; };
  /* cell builders */
  const tk = (r) => { const s = el('span', 'tk'); s.append(star(r, () => draw()), r.t); if (r.held) s.appendChild(tipped(el('i', 'dot'), D.held)); return s; };
  const co = (r) => el('span', 'co', r.n);

      ['Share count, 1 yr', sp(r.sh, 1), D.sh], ['Three rules', r.ru + ' of 3', D.rules], ['Spending ÷ depreciation', nm(r.cd, 1, '×'), D.cd], ['Stock pay / sales', pc(r.sb), D.sb]])));

      ['Analysts', r.an ? r.an[0] + ' (' + r.an[1] + ')' : 'Not connected', D.an], ['Latest quarter', r.q, 'End of the latest quarter in the company’s filings.']])));
    const ul = el('ul', 'checks'); TRAITS.forEach((t, i) => { const li = el('li', r.tb >> i & 1 ? 'on' : ''); const tx = el('span'); tx.append(t[0] + '. ', el('span', 'mut', t[1])); li.append(el('i'), tx); ul.appendChild(li); });
    out.push(sec('PLTR-like traits: ' + r.gt + ' of 6' + (r.od != null ? ', past odds ' + pc(r.od, 1) : ', already large'), ul));
    const own = r.own.slice().sort((a, b) => b[1] - a[1]);
    out.push(sec('Tracked funds: ' + r.nf + ' of ' + NF + ' hold it', own.length ? cardOf(table([{h: 'Fund', f: (o) => { const b = el('button', 'linkish', F[o[0]].name); b.onclick = () => openPanel(() => fundPanel(o[0]), true); return b; }},
      {h: 'Weight', tip: D.w, f: (o) => o[2] === 'sold' ? '–' : pc(o[1], 1), n: 1}, {h: 'Move', tip: D.move, f: (o) => chip(MOVE[o[2]], o[2])}, {h: 'Quarters', tip: D.qh, f: (o) => o[2] === 'sold' ? '–' : (o[3] >= 5 ? '5+' : o[3]), n: 1}], own)) : el('p', 'mut', 'None of the tracked funds holds it.')));
    return out; }
  const cardOf = (t) => { const c = el('div', 'card'), s = el('div', 'scroll'); s.appendChild(t); c.appendChild(s); return c; };
  let fchg = 'All';
  function fundPanel(i) { const f = F[i], out = [], head = el('div');
    head.append(el('h2', '', f.name), el('p', 'mut', '$' + f.bn + 'B in ' + f.n + ' positions, ' + f.top10 + '% in the top ten, as of ' + asof)); out.push(head);
    const seg = el('div', 'seg'); ['All', 'New', 'Added', 'Held', 'Cut'].forEach((k) => { const b = el('button', '', k + (k === 'All' ? '' : ' ' + f.counts[k.toLowerCase()])); b.setAttribute('aria-pressed', k === fchg); b.onclick = () => { fchg = k; paint(); }; seg.appendChild(b); }); out.push(seg);
    const rows = f.h.filter((x) => fchg === 'All' || MOVE[x[3]] === fchg);
    out.push(rows.length ? cardOf(table([{h: 'Ticker', f: (x) => x[0] ? tlink(x[0]) : el('span', 'mut', '–')}, {h: 'Company', f: (x) => el('span', 'co', x[1]), hs: 1}, {h: 'Weight', tip: D.w, f: (x) => pc(x[2], 1), n: 1}, {h: 'Move', tip: D.move, f: (x) => chip(MOVE[x[3]], x[3])},
      {h: 'Shares', tip: D.dsh, f: (x) => x[3] === 'new' ? '–' : sp(x[4]), n: 1}, {h: 'Quarters', tip: D.qh, f: (x) => x[5] >= 5 ? '5+' : x[5], n: 1}], rows)) : el('p', 'mut', 'None among its 30 largest positions.'));
    out.push(el('p', 'mut', 'The 30 largest positions are listed, so the counts above can be higher than the rows shown.'));
    if (f.sold.length) { const p = el('p'); p.append(el('span', 'mut', 'Sold out last quarter: ')); f.sold.forEach((x, j) => { p.append(x[0] ? tlink(x[0]) : x[1], j < f.sold.length - 1 ? ', ' : ''); }); out.push(p); }
    if (f.hidden_n) out.push(el('p', 'mut', f.hidden_n + (f.hidden_n > 1 ? ' positions' : ' position') + ' worth ' + pc(f.hidden_w, 1) + ' of the book ' + (f.hidden_n > 1 ? 'are' : 'is') + ' left out: names this desk cannot show.'));
    return out; }
  function macroPanel() { const head = el('div'); head.append(el('h2', '', d.home.shock_on + ' of ' + d.home.shock_total + ' price-shock warnings are on'), el('p', 'mut', D.shock));
    const g = cardOf(table([{h: 'Warnings on', f: (x) => x.on}, {h: 'S&P next 12 mo, 1993–2009', f: (x) => sp(x.next12_1, 1), n: 1, cls: (x) => sgn(x.next12_1)}, {h: '2010–2026', f: (x) => sp(x.next12_2, 1), n: 1, cls: (x) => sgn(x.next12_2)}, {h: 'Times it fell', tip: 'Share of months after which the S&P was lower a year later, 2010–2026.', f: (x) => pc(x.down_2), n: 1}], d.gauge));
    const kept = d.macro.filter((m) => m.kept), rest = d.macro.filter((m) => !m.kept), row = [{h: 'Warning', f: (m) => m.w}, {h: 'Now', f: (m) => chip(m.on ? 'On' : 'Off', m.on ? 'bad' : '')}];
    const det = el('details'), sm = el('summary', 'mut', rest.length + ' other warnings were tested and did not hold up in both periods (' + rest.filter((m) => m.on).length + ' are on now)'); det.append(sm, cardOf(table(row, rest)));
    return [head, sec('What stocks did next', g), sec('The three warnings', cardOf(table(row, kept))), det, el('p', 'mut', 'About one of 21 warnings would pass this test by luck, so the desk reads the gauge and does not trade on it.')]; }
  function bookPanel() { const h = d.home, head = el('div'); head.append(el('h2', '', 'Book ' + sp(h.book, 1) + ' since ' + h.since), el('p', 'mut', 'S&P 500 ' + sp(h.spx, 1) + ' over the same days. A 30%-a-year pace would be ' + sp(h.pace, 1) + ' by now.'));
    return [head, sec('Against its targets', cardOf(table([{h: 'Block', f: (r) => r[0]}, {h: 'Now', f: (r) => pc(r[1], 1), n: 1}, {h: 'Target', f: (r) => r[2]}], d.book))), sec('To do', el('p', '', h.todo)),
      el('p', 'mut', 'Your picks: ' + h.names + ' of ' + h.max_names + ' names. A thesis card before every buy, a 30-day minimum hold, order sheets only.')]; }
  function testsPanel() { const head = el('div'); head.append(el('h2', '', 'What was tested'), el('p', 'mut', 'Every idea was scored on past data before it could move money. None of the stock-picking models passed, so these lists are for reading, and you decide.'));
    const dlx = el('dl', 'defs'); d.research.forEach((r) => { const dt = el('dt', '', r[0]), dd = el('dd'); dd.append(el('span', /Adopted/.test(r[1]) ? 'up' : '', r[1] + '. '), r[2]); dlx.append(dt, dd); }); return [head, dlx]; }
  function defsPanel() { const head = el('div'); head.append(el('h2', '', 'Definitions'), el('p', 'mut', 'The same notes appear when you hover over or tap any underlined label.'));
    const items = [['Size rank', D.rank], ['Sales growth', D.g], ['Gross margin', D.gm], ['R&D / sales', D.rd], ['Cash flow / assets', D.cf], ['Cash less debt', D.nc], ['Share count', D.sh], ['Three rules', D.rules], ['Spending ÷ depreciation', D.cd], ['Stock pay / sales', D.sb],
      ['Price, 6 and 12 months', D.p], ['From 12-month high', D.oh], ['PLTR-like traits', TRAITS.map((t) => t[0]).join('; ') + '.'], ['Past odds', D.odds], ['Tracked funds', D.f13], ['Funds holding', D.nf], ['Top 10 for', D.top], ['Average weight', D.avgw], ['Held 4+ quarters', D.long],
      ['New, Added, Held, Cut, Sold', D.move], ['Adding', D.add], ['Added twice running', D.twice], ['Technical', D.tech], ['Analysts', D.an], ['Circular financing', D.circ], ['Burry short', D.burry], ['Price-shock gauge', D.shock], ['Leader', D.lead], ['Thirds', D.thirds], ['Star and shortlist', D.star], ['2+ lists', D.nlists], ['Blue dot', D.held]];
    const dlx = el('dl', 'defs'); items.forEach(([k, v]) => dlx.append(el('dt', '', k), el('dd', '', v))); return [head, dlx]; }

  /* top readouts and footer */
  const h = d.home, ro = (label, big, small, tip, fn, cls) => { const b = el('button', 'readout'); b.append(el('span', '', label), el('b', cls || '', big), el('span', '', small)); tipped(b, tip); b.onclick = () => openPanel(fn); $('#readouts').appendChild(b); };
  ro('Price shock', h.shock_on + ' of ' + h.shock_total, 'warnings on', D.shock, macroPanel, h.shock_on >= 2 ? 'warn' : '');
  ro('Book', sp(h.book, 1), 'S&P ' + sp(h.spx, 1), D.book, bookPanel);
  ro('Your picks', pc(h.tactical, 1), 'cap ' + pc(h.cap), D.picks, bookPanel);
  $('#f-defs').onclick = () => openPanel(defsPanel); $('#f-tests').onclick = () => openPanel(testsPanel);
  $('#built').textContent = 'Readings, not signals. Fund filings as of ' + asof + ', prices through ' + through + ', built ' + d.built.slice(0, 10) + '.';
  const hash = (location.hash || '').slice(1); if (LISTS.some((L) => L.id === hash)) S.list = hash; draw();
}
</script></body></html>

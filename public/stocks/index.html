<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Norman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--bg:#fff;--fg:#141414;--mut:#6b6b6b;--line:#dbdbdb;--soft:#f5f5f3;--bad:#a8281f;--good:#1b7a3a;--a:#1f4e79;--b:#9a7b2c}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#f2f2f0;--mut:#9a9a9a;--line:#222;--soft:#141414;--bad:#ff8f85;--good:#6fd08c;--a:#8fbde8;--b:#dcc27a;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Times New Roman",Tinos,Times,serif;font-variant-numeric:tabular-nums}
main{max-width:1120px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;font-weight:400;margin:0;font-variant-caps:small-caps;letter-spacing:.04em}
h2{font-size:15px;font-weight:400;margin:0;font-variant-caps:small-caps;letter-spacing:.06em;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.sm{font-size:13px;color:var(--mut)}.num{text-align:right;white-space:nowrap}.bad{color:var(--bad)}.good{color:var(--good)}
button,input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 10px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,tr:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;padding:4px 2px;font-variant-caps:small-caps;letter-spacing:.05em;color:var(--mut)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
.chip[aria-pressed=true],.seg[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;border-radius:3px;min-width:0}
.card b{font-weight:400;font-size:24px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:400;color:var(--mut);border-bottom:1px solid var(--fg);padding:5px 12px 5px 0;white-space:nowrap;font-variant-caps:small-caps;letter-spacing:.04em}
th.s{cursor:pointer}th.s[aria-sort]::after{content:" ▾"}th.s[aria-sort=ascending]::after{content:" ▴"}
td{border-bottom:1px solid var(--line);padding:5px 12px 5px 0;vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:var(--soft)}
.detail>td{background:var(--soft);padding:12px}.detail .wrap{max-width:560px}.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px}
.dl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line)}.dl span:first-child{color:var(--mut)}
.tag{border:1px solid var(--line);border-radius:2px;padding:0 5px;font-size:12px;white-space:nowrap;margin-right:4px}.tag.on{border-color:var(--bad);color:var(--bad)}
.fund{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:22px}@media (max-width:760px){.fund{grid-template-columns:1fr}}
.flist{display:flex;flex-direction:column;max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:3px}
.flist button{border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;display:flex;justify-content:space-between;gap:8px;padding:7px 10px}
.flist button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
a{color:var(--a)}circle.pt{fill:var(--fg);fill-opacity:.55;cursor:pointer}circle.pt:hover{fill:var(--bad);fill-opacity:1}svg text{fill:var(--mut);font-size:12px;font-family:inherit}
</style></head><body><main>
<h1>Norman</h1>
<form id="gate" class="row"><label for="pw" class="sm">Password</label><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" autofocus><button type="submit">Open</button><span id="msg" class="sm bad" role="status"></span></form>
<div id="app" class="col" hidden>
<div class="row" role="tablist" id="tabs"></div>
<section id="v-overview" class="col"></section><section id="v-screener" class="col" hidden></section><section id="v-funds" class="col" hidden></section>
<section id="v-macro" class="col" hidden></section><section id="v-book" class="col" hidden></section><section id="v-research" class="col" hidden></section>
<p class="sm" id="foot"></p>
</div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const sp = (v, d = 0) => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(d) + '%', pc = (v, d = 0) => v == null ? '—' : v.toFixed(d) + '%';
const nm = (v, d = 1, u = '') => v == null ? '—' : v.toFixed(d) + u;
async function unlock(pw) {
  const dir = location.pathname.endsWith('.html') ? location.pathname.replace(/[^/]*$/, '') : location.pathname.replace(/\/?$/, '/');
  const res = await fetch(dir + 'data.enc.json', {cache: 'no-store'});
  if (!res.ok) throw new Error('nodata');
  const e = await res.json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(e.iv)}, key, b64(e.ct))));
}
$('#gate').addEventListener('submit', async (ev) => {
  ev.preventDefault(); $('#msg').textContent = 'Opening…';
  try { const d = await unlock($('#pw').value); try { sessionStorage.setItem('n', $('#pw').value); } catch (_) {} $('#gate').hidden = true; $('#app').hidden = false; render(d); }
  catch (err) { $('#msg').textContent = (err && err.message === 'nodata') ? 'Could not load the data file' : 'Wrong password'; }
});
try { const s = sessionStorage.getItem('n'); if (s) { $('#pw').value = s; $('#gate').requestSubmit(); } } catch (_) {}

function table(head, rows, opt = {}) {
  const w = el('div', 'wrap'), t = el('table'), h = t.createTHead().insertRow();
  head.forEach((c, i) => { const th = el('th', (c.n ? 'num ' : '') + (opt.sort ? 's' : ''), c.h); if (opt.sort) { th.tabIndex = 0; if (opt.sorted && opt.sorted.i === i) th.setAttribute('aria-sort', opt.sorted.asc ? 'ascending' : 'descending'); const go = () => opt.sort(i); th.onclick = go; th.onkeydown = (e) => { if (e.key === 'Enter') go(); }; } h.appendChild(th); });
  const tb = t.createTBody();
  rows.forEach((r) => { const tr = tb.insertRow(); if (opt.click) { tr.className = 'r'; tr.tabIndex = 0; tr.onclick = () => opt.click(r, tr); tr.onkeydown = (e) => { if (e.key === 'Enter') opt.click(r, tr); }; }
    head.forEach((c) => { const td = tr.insertCell(); if (c.n) td.className = 'num'; const v = c.f(r); if (v instanceof Node) td.appendChild(v); else td.textContent = v; if (c.cls) { const k = c.cls(r); if (k) td.classList.add(k); } }); });
  w.appendChild(t); return w;
}
const tags = (s) => { const f = document.createDocumentFragment(); (s || '').split('; ').filter(Boolean).forEach((x) => f.appendChild(el('span', 'tag' + (/Circular|Burry/.test(x) ? ' on' : ''), x))); return f; };
const CH = {new: 'New', added: 'Added', cut: 'Cut', held: 'Held', sold: 'Sold'};

function render(d) {
  const U = d.universe, F = d.funds.list, byT = Object.fromEntries(U.map((r) => [r.t, r]));
  const TABS = ['overview', 'screener', 'funds', 'macro', 'book', 'research'];
  const show = (id) => { TABS.forEach((t) => { $('#v-' + t).hidden = t !== id; $('#t-' + t).setAttribute('aria-selected', t === id); }); try { history.replaceState(null, '', '#' + id); } catch (_) {} };
  TABS.forEach((t) => { const b = el('button', 'tab', t[0].toUpperCase() + t.slice(1)); b.id = 't-' + t; b.setAttribute('role', 'tab'); b.onclick = () => show(t); $('#tabs').appendChild(b); });

  // ---- screener state
  const S = {q: '', lens: new Set(), sector: '', g: '', gt: '', nf: '', cols: 'Basics', sort: {i: -1, asc: false}, n: 60, view: 'Table', x: 'g', y: 'p'};
  const NUM = {g: 'Sales growth %', p: 'Price, 12 mo %', oh: 'From 12-mo high %', gm: 'Gross margin %', rd: 'R&D / sales %', cf: 'Cash flow / assets %', sh: 'Share count %', cd: 'Spending ÷ depreciation', sb: 'Stock pay / sales %', sl: 'Sales, $B', nc: 'Cash less debt, $B', k: 'Size rank', nf: 'Funds holding', gt: 'Giant traits'};
  const COLS = {
    Basics: [{h: 'Ticker', f: (r) => r.t, k: 't'}, {h: 'Company', f: (r) => r.n, k: 'n'}, {h: 'Sector', f: (r) => r.s, k: 's'}, {h: 'Sales growth', n: 1, f: (r) => sp(r.g), k: 'g'}, {h: 'Rules', n: 1, f: (r) => r.ru + '/3', k: 'ru'}, {h: 'Giant traits', n: 1, f: (r) => r.gt + '/6', k: 'gt'}, {h: 'Price, 12 mo', n: 1, f: (r) => sp(r.p), k: 'p', cls: (r) => r.p == null ? '' : r.p < 0 ? 'bad' : 'good'}],
    Quality: [{h: 'Ticker', f: (r) => r.t, k: 't'}, {h: 'Company', f: (r) => r.n, k: 'n'}, {h: 'Gross margin', n: 1, f: (r) => pc(r.gm), k: 'gm'}, {h: 'R&D / sales', n: 1, f: (r) => pc(r.rd), k: 'rd'}, {h: 'Cash flow / assets', n: 1, f: (r) => pc(r.cf), k: 'cf'}, {h: 'Cash less debt, $B', n: 1, f: (r) => nm(r.nc), k: 'nc'}, {h: 'Share count', n: 1, f: (r) => sp(r.sh, 1), k: 'sh'}],
    Burry: [{h: 'Ticker', f: (r) => r.t, k: 't'}, {h: 'Company', f: (r) => r.n, k: 'n'}, {h: 'Spending ÷ depreciation', n: 1, f: (r) => nm(r.cd, 1, '×'), k: 'cd'}, {h: 'Stock pay / sales', n: 1, f: (r) => pc(r.sb), k: 'sb'}, {h: 'Sales, $B', n: 1, f: (r) => nm(r.sl), k: 'sl'}, {h: 'From 12-mo high', n: 1, f: (r) => sp(r.oh), k: 'oh'}],
    Funds: [{h: 'Ticker', f: (r) => r.t, k: 't'}, {h: 'Company', f: (r) => r.n, k: 'n'}, {h: 'Funds holding', n: 1, f: (r) => r.nf, k: 'nf'}, {h: 'Buying', n: 1, f: (r) => r.nb, k: 'nb'}, {h: 'Selling', n: 1, f: (r) => r.ns, k: 'ns'}, {h: 'Lenses', f: (r) => tags(r.tags), k: 'tags'}],
  };
  const sv = $('#v-screener'), ctl = el('div', 'row'), chips = el('div', 'row'), segs = el('div', 'row'), count = el('span', 'sm'), box = el('div', 'col');
  const search = el('input'); search.type = 'search'; search.placeholder = 'Ticker or name'; search.setAttribute('aria-label', 'Search'); search.oninput = () => { S.q = search.value.trim().toLowerCase(); S.n = 60; draw(); };
  const sel = (label, key, opts) => { const s = el('select'); s.setAttribute('aria-label', label); opts.forEach(([v, t]) => { const o = el('option', '', t); o.value = v; s.appendChild(o); }); s.onchange = () => { S[key] = s.value; S.n = 60; draw(); }; return s; };
  const sectors = [...new Set(U.map((r) => r.s))].sort();
  const selS = sel('Sector', 'sector', [['', 'All sectors']].concat(sectors.map((x) => [x, x])));
  const selG = sel('Sales growth', 'g', [['', 'Any sales growth'], ['10', 'Sales up 10%+'], ['20', 'Sales up 20%+'], ['40', 'Sales up 40%+']]);
  const selT = sel('Giant traits', 'gt', [['', 'Any giant traits'], ['4', '4+ of 6'], ['5', '5+ of 6'], ['6', '6 of 6']]);
  const selF = sel('Funds holding', 'nf', [['', 'Any fund count'], ['1', 'Held by 1+ funds'], ['3', 'Held by 3+'], ['5', 'Held by 5+']]);
  const reset = el('button', '', 'Reset'); reset.onclick = () => { S.q = ''; S.lens.clear(); S.sector = S.g = S.gt = S.nf = ''; search.value = ''; [selS, selG, selT, selF].forEach((s) => s.value = ''); S.n = 60; draw(); };
  ctl.append(search, selS, selG, selT, selF, reset, count);
  [['Held', 'Held'], ['Rules', 'Passes rules'], ['Giant', 'Looks like a giant'], ['Druck', 'Druckenmiller'], ['Circular', 'Circular financing'], ['Burry', 'Burry short']].forEach(([k, name]) => { const b = el('button', 'chip', name); b.setAttribute('aria-pressed', 'false'); b.onclick = () => { S.lens.has(k) ? S.lens.delete(k) : S.lens.add(k); b.setAttribute('aria-pressed', S.lens.has(k)); S.n = 60; draw(); }; chips.appendChild(b); });
  ['Table', 'Chart'].forEach((k) => { const b = el('button', 'seg view', k); b.setAttribute('aria-pressed', k === S.view); b.onclick = () => { S.view = k; [...segs.querySelectorAll('.view')].forEach((x) => x.setAttribute('aria-pressed', x === b)); draw(); }; segs.appendChild(b); });
  const axis = (key) => { const s = el('select'); s.setAttribute('aria-label', key === 'x' ? 'Across' : 'Up'); Object.entries(NUM).forEach(([v, t]) => { const o = el('option', '', (key === 'x' ? 'Across: ' : 'Up: ') + t); o.value = v; s.appendChild(o); }); s.value = S[key]; s.onchange = () => { S[key] = s.value; draw(); }; return s; };
  const selX = axis('x'), selY = axis('y'), colLab = el('span', 'sm', 'Columns');
  const exp = el('button', '', 'Download CSV');
  segs.append(selX, selY, colLab);
  Object.keys(COLS).forEach((k) => { const b = el('button', 'seg', k); b.setAttribute('aria-pressed', k === S.cols); b.classList.add('cset'); b.onclick = () => { S.cols = k; S.sort = {i: -1, asc: false}; [...segs.querySelectorAll('.cset')].forEach((x) => x.setAttribute('aria-pressed', x === b)); draw(); }; segs.appendChild(b); });
  segs.appendChild(exp);
  const scatter = (rows) => {
    const NS = 'http://www.w3.org/2000/svg', W = 900, H = 440, L = 56, B = 40, pts = rows.filter((r) => r[S.x] != null && r[S.y] != null);
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', '100%'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', NUM[S.y] + ' against ' + NUM[S.x]);
    const add = (tag, at, txt) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (txt != null) n.textContent = txt; svg.appendChild(n); return n; };
    if (!pts.length) { add('text', {x: W / 2, y: H / 2, 'text-anchor': 'middle'}, 'No stocks with both numbers'); return svg; }
    const rng = (k) => { const v = pts.map((r) => r[k]).sort((a, b) => a - b), q = (f) => v[Math.min(v.length - 1, Math.floor(f * (v.length - 1)))]; let lo = q(pts.length > 40 ? .02 : 0), hi = q(pts.length > 40 ? .98 : 1); if (lo === hi) { lo -= 1; hi += 1; } return [lo, hi]; };
    const [x0, x1] = rng(S.x), [y0, y1] = rng(S.y), cl = (v, a, b) => Math.max(a, Math.min(b, v));
    const X = (v) => L + (cl(v, x0, x1) - x0) / (x1 - x0) * (W - L - 14), Y = (v) => H - B - (cl(v, y0, y1) - y0) / (y1 - y0) * (H - B - 14), f = (v) => Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1);
    add('line', {x1: L, x2: W - 14, y1: H - B, y2: H - B, stroke: 'var(--line)'}); add('line', {x1: L, x2: L, y1: 14, y2: H - B, stroke: 'var(--line)'});
    if (x0 < 0 && x1 > 0) add('line', {x1: X(0), x2: X(0), y1: 14, y2: H - B, stroke: 'var(--line)', 'stroke-dasharray': '3 3'});
    if (y0 < 0 && y1 > 0) add('line', {x1: L, x2: W - 14, y1: Y(0), y2: Y(0), stroke: 'var(--line)', 'stroke-dasharray': '3 3'});
    [x0, (x0 + x1) / 2, x1].forEach((v, i) => add('text', {x: X(v), y: H - B + 16, 'text-anchor': ['start', 'middle', 'end'][i]}, f(v)));
    [y0, (y0 + y1) / 2, y1].forEach((v) => add('text', {x: L - 6, y: Y(v) + 4, 'text-anchor': 'end'}, f(v)));
    add('text', {x: (L + W) / 2, y: H - 4, 'text-anchor': 'middle'}, NUM[S.x]); add('text', {x: L, y: 10}, NUM[S.y]);
    pts.forEach((r) => { const c = add('circle', {class: 'pt', cx: X(r[S.x]), cy: Y(r[S.y]), r: pts.length > 300 ? 2.5 : 4, tabindex: pts.length <= 60 ? 0 : -1}); add('title', {}, ''); c.appendChild(svg.lastChild); c.firstChild.textContent = `${r.t} · ${r.n} · ${NUM[S.x]} ${f(r[S.x])} · ${NUM[S.y]} ${f(r[S.y])}`; c.onclick = () => openStock(r.t); c.onkeydown = (e) => { if (e.key === 'Enter') openStock(r.t); };
      if (pts.length <= 40) add('text', {x: X(r[S.x]) + 6, y: Y(r[S.y]) + 4}, r.t); });
    return svg;
  };
  exp.onclick = () => { const keys = ['t', 'n', 's', 'k', 'g', 'gm', 'rd', 'cf', 'nc', 'sl', 'sh', 'cd', 'sb', 'p', 'oh', 'ru', 'gt', 'od', 'nf', 'nb', 'ns', 'tags'], head = ['ticker', 'company', 'sector', 'size_rank', 'sales_growth', 'gross_margin', 'rd_sales', 'cashflow_assets', 'net_cash_bn', 'sales_bn', 'share_chg', 'capex_dep', 'stockpay_sales', 'price_12m', 'off_high', 'rules', 'giant_traits', 'giant_odds', 'funds_holding', 'funds_buying', 'funds_selling', 'lenses'];
    const csv = [head.join(',')].concat(filtered().map((r) => keys.map((k) => r[k] == null ? '' : '"' + String(r[k]).replace(/"/g, '""') + '"').join(','))).join('\n');
    const a = el('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = 'norman-screen.csv'; a.click(); URL.revokeObjectURL(a.href); };
  sv.append(ctl, chips, segs, box);
  const detail = (r) => {
    const w = el('div', 'col'), dl = el('div', 'dl');
    [['Size rank', r.k], ['Sector', r.s], ['Latest quarter', r.q], ['Sales growth', sp(r.g)], ['Sales, $B', nm(r.sl)], ['Gross margin', pc(r.gm)], ['R&D / sales', pc(r.rd)], ['Cash flow / assets', pc(r.cf)], ['Cash less debt, $B', nm(r.nc)], ['Share count, 1 yr', sp(r.sh, 1)],
      ['Spending ÷ depreciation', nm(r.cd, 1, '×')], ['Stock pay / sales', pc(r.sb)], ['Price, 12 mo', sp(r.p)], ['From 12-mo high', sp(r.oh)], ['Rules passed', r.ru + ' of 3'], ['Giant traits', r.gt + ' of 6'], ['Past odds of becoming a giant', r.od == null ? 'n/a (already large)' : pc(r.od, 1)]]
      .forEach(([k, v]) => { const x = el('div'); x.append(el('span', '', k), el('span', '', String(v))); dl.appendChild(x); });
    w.appendChild(dl);
    if (r.tags) { const p = el('div'); p.appendChild(tags(r.tags)); if (r.why) { p.appendChild(document.createTextNode(' ' + r.why + ' ')); if (r.src) { const a = el('a', '', 'source'); a.href = r.src; a.target = '_blank'; a.rel = 'noopener'; p.appendChild(a); } } w.appendChild(p); }
    if (r.own.length) w.appendChild(table([{h: 'Fund', f: (o) => F[o[0]].name}, {h: '% of its book', n: 1, f: (o) => o[2] === 'sold' ? '—' : pc(o[1], 1)}, {h: 'Last quarter', f: (o) => CH[o[2]]}], r.own.slice().sort((a, b) => b[1] - a[1])));
    else w.appendChild(el('span', 'sm', 'None of the tracked funds holds it.'));
    return w;
  };
  const filtered = () => U.filter((r) => (!S.q || r.t.toLowerCase().startsWith(S.q) || r.n.toLowerCase().includes(S.q)) && [...S.lens].every((l) => r.tags.includes(l)) && (!S.sector || r.s === S.sector)
      && (!S.g || (r.g != null && r.g >= +S.g)) && (!S.gt || r.gt >= +S.gt) && (!S.nf || r.nf >= +S.nf));
  function draw() {
    let rows = filtered(); const cols = COLS[S.cols], chart = S.view === 'Chart';
    selX.hidden = selY.hidden = !chart; colLab.hidden = chart; [...segs.querySelectorAll('.cset')].forEach((b) => b.hidden = chart);
    count.textContent = rows.length + ' of ' + U.length;
    if (chart) { box.replaceChildren(scatter(rows), el('span', 'sm', 'Each dot is a stock; click one to open it. The outer 2% on each side sit on the edge.')); return; }
    if (S.sort.i >= 0) { const k = cols[S.sort.i].k, dir = S.sort.asc ? 1 : -1; rows = rows.slice().sort((a, b) => { const x = a[k], y = b[k]; if (x == null) return 1; if (y == null) return -1; return (typeof x === 'string' ? x.localeCompare(y) : x - y) * dir; }); }
    const t = table(cols, rows.slice(0, S.n), {sorted: S.sort, sort: (i) => { S.sort = {i, asc: S.sort.i === i ? !S.sort.asc : typeof U[0][cols[i].k] === 'string'}; draw(); },
      click: (r, tr) => { const nx = tr.nextSibling; if (nx && nx.classList.contains('detail')) { nx.remove(); return; } const d2 = tr.parentNode.insertRow(tr.sectionRowIndex + 1); d2.className = 'detail'; const c = d2.insertCell(); c.colSpan = cols.length; c.appendChild(detail(r)); }});
    box.replaceChildren(t);
    if (rows.length > S.n) { const more = el('button', '', 'Show more'); more.onclick = () => { S.n += 100; draw(); }; box.appendChild(more); }
  }
  draw();
  const openStock = (t) => { if (!byT[t]) return; reset.onclick(); S.view = 'Table'; [...segs.querySelectorAll('.view')].forEach((x) => x.setAttribute('aria-pressed', x.textContent === 'Table')); search.value = t; S.q = t.toLowerCase(); draw(); show('screener'); const tr = [...box.querySelectorAll('tr.r')].find((x) => x.cells[0].textContent === t); if (tr) tr.click(); };
  const tk = (t) => { if (!t || !byT[t]) return t || '—'; const b = el('a', '', t); b.href = '#screener'; b.onclick = (e) => { e.preventDefault(); openStock(t); }; return b; };

  // ---- overview
  const h = d.home, ov = $('#v-overview'), cards = el('div', 'grid');
  const card = (k, big, small, to, cls) => { const b = el('button', 'card'); b.append(el('span', 'sm', k), el('b', cls || '', big), el('span', 'sm', small)); b.onclick = () => show(to); return b; };
  cards.append(card('Macro', h.shock_on + ' of ' + h.shock_total, 'price-shock warnings on', 'macro', h.shock_on >= 2 ? 'bad' : ''),
    card('Book since ' + h.since, sp(h.book, 1), 'S&P ' + sp(h.spx, 1) + ' · 30% pace ' + sp(h.pace, 1), 'book'),
    card('Your picks', pc(h.tactical, 1), 'of a ' + pc(h.cap) + ' cap · ' + h.names + ' of ' + h.max_names + ' names', 'book'),
    card('To do', '', h.todo, 'book'));
  const two = el('div', 'two'), top = (title, rows, cols) => { const c = el('div', 'col'); c.append(el('h2', '', title), table(cols, rows)); return c; };
  two.append(top('Most bought by tracked funds, last quarter', U.filter((r) => r.nb > 0).sort((a, b) => b.nb - a.nb || b.nf - a.nf).slice(0, 8), [{h: 'Ticker', f: (r) => tk(r.t)}, {h: 'Company', f: (r) => r.n}, {h: 'Buying', n: 1, f: (r) => r.nb}, {h: 'Holding', n: 1, f: (r) => r.nf}]),
    top('Look most like past giants', U.filter((r) => r.k > 300 && r.gt >= 5).sort((a, b) => b.gt - a.gt || a.k - b.k).slice(0, 8), [{h: 'Ticker', f: (r) => tk(r.t)}, {h: 'Company', f: (r) => r.n}, {h: 'Traits', n: 1, f: (r) => r.gt + '/6'}, {h: 'Past odds', n: 1, f: (r) => pc(r.od, 1)}]));
  ov.append(cards, two);

  // ---- funds
  const fv = $('#v-funds'), agg = el('div', 'row'), aggBox = el('div'), fund = el('div', 'fund'), fl = el('div', 'flist'), fb = el('div', 'col');
  const AG = {'Most held': (r) => r.nf, 'Most bought': (r) => r.nb, 'Most sold': (r) => r.ns};
  const drawAgg = (k) => { [...agg.querySelectorAll('.seg')].forEach((b) => b.setAttribute('aria-pressed', b.textContent === k));
    aggBox.replaceChildren(table([{h: 'Ticker', f: (r) => tk(r.t)}, {h: 'Company', f: (r) => r.n}, {h: 'Holding', n: 1, f: (r) => r.nf}, {h: 'Buying', n: 1, f: (r) => r.nb}, {h: 'Selling', n: 1, f: (r) => r.ns}], U.filter((r) => AG[k](r) > 0).sort((a, b) => AG[k](b) - AG[k](a) || b.nf - a.nf).slice(0, 12))); };
  agg.appendChild(el('h2', '', 'Across ' + F.length + ' funds'));
  Object.keys(AG).forEach((k) => { const b = el('button', 'seg', k); b.onclick = () => drawAgg(k); agg.appendChild(b); });
  let fsel = 0, fchg = 'All';
  const drawFund = (i) => { fsel = i; const f = F[i]; [...fl.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
    const head = el('div', 'row'); head.append(el('b', '', f.name), el('span', 'sm', '$' + f.bn + 'B · ' + f.n + ' positions · top 10 = ' + f.top10 + '% · ' + f.counts.new + ' new, ' + f.counts.added + ' added, ' + f.counts.cut + ' cut'));
    const kids = [head, table([{h: 'Ticker', f: (x) => tk(x[0])}, {h: 'Company', f: (x) => x[1]}, {h: '% of book', n: 1, f: (x) => pc(x[2], 1)}, {h: 'Last quarter', f: (x) => CH[x[3]], cls: (x) => x[3] === 'new' || x[3] === 'added' ? 'good' : x[3] === 'cut' ? 'bad' : ''}, {h: 'Shares', n: 1, f: (x) => x[3] === 'new' ? '—' : sp(x[4])}], f.h.filter((x) => fchg === 'All' || CH[x[3]] === fchg))];
    const fs = el('div', 'row'); ['All', 'New', 'Added', 'Cut', 'Held'].forEach((k) => { const b = el('button', 'seg', k); b.setAttribute('aria-pressed', k === fchg); b.onclick = () => { fchg = k; drawFund(fsel); }; fs.appendChild(b); }); kids.splice(1, 0, fs);
    if (f.sold.length) { const s = el('p', 'sm', 'Sold out: '); f.sold.forEach((x, j) => { s.append(x[0] ? tk(x[0]) : x[1], j < f.sold.length - 1 ? ', ' : ''); }); kids.push(s); }
    if (f.hidden_n) kids.push(el('p', 'sm', f.hidden_n + ' position' + (f.hidden_n > 1 ? 's' : '') + ' (' + pc(f.hidden_w, 1) + ' of the book) not shown: names this desk cannot list.'));
    fb.replaceChildren(...kids); };
  F.forEach((f, i) => { const b = el('button'); b.append(el('span', '', f.name), el('span', 'sm', '$' + f.bn + 'B')); b.onclick = () => drawFund(i); fl.appendChild(b); });
  fund.append(fl, fb);
  fv.append(agg, aggBox, el('h2', '', 'Holdings as of ' + d.funds.asof + ' (13F; shares only, top 30 shown)'), fund);
  drawAgg('Most bought'); drawFund(0);

  // ---- macro
  const mv = $('#v-macro'), W = 640, H = 220, x = (i, k) => 70 + i * 140 + k * 46, y = (v) => 120 - v * 3.2, NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.style.maxWidth = '640px'; svg.setAttribute('width', '100%'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Average S&P return over the next 12 months by number of price-shock warnings on');
  const add = (tag, at, txt) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); if (txt) n.textContent = txt; svg.appendChild(n); };
  add('line', {x1: 40, x2: W - 10, y1: y(0), y2: y(0), stroke: 'var(--line)'});
  d.gauge.forEach((g, i) => { [['next12_1', 'var(--a)'], ['next12_2', 'var(--b)']].forEach(([f, col], k) => { const v = g[f]; if (v == null) return;
    add('rect', {x: x(i, k), width: 40, y: Math.min(y(v), y(0)), height: Math.abs(y(v) - y(0)), fill: col}); add('text', {x: x(i, k) + 20, y: v >= 0 ? y(v) - 5 : y(v) + 14, 'text-anchor': 'middle'}, sp(v)); });
    add('text', {x: x(i, 0) + 43, y: H - 8, 'text-anchor': 'middle'}, g.on + ' on'); });
  mv.append(el('h2', '', 'S&P over the next 12 months, by price-shock warnings on'), el('span', 'sm', 'Blue 1993–2009 · gold 2010–2026 · a reading, not a rule'), svg,
    table([{h: 'Warning', f: (r) => r.w}, {h: 'Now', f: (r) => el('span', 'tag' + (r.on ? ' on' : ''), r.on ? 'ON' : 'off')}, {h: 'Held up in both halves', f: (r) => r.kept ? 'yes' : 'no'}], d.macro));

  // ---- book and research
  $('#v-book').append(table([{h: 'Block', f: (r) => r[0]}, {h: 'Now', n: 1, f: (r) => pc(r[1], 1)}, {h: 'Target', f: (r) => r[2]}], d.book), el('span', 'sm', 'A thesis card before every buy · 30-day minimum hold · order sheets only'));
  $('#v-research').append(table([{h: 'What was tested', f: (r) => r[0]}, {h: 'Verdict', f: (r) => r[1]}, {h: 'Result', f: (r) => r[2]}], d.research));
  $('#foot').textContent = 'Readings, not signals. No model moves money. Built ' + d.built.replace('T', ' ').slice(0, 16) + ' UTC.';
  const start = (location.hash || '').slice(1); show(TABS.includes(start) ? start : 'overview');
}
</script></body></html>
